<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Dashboard</title>

<style>
:root{
 --bg:#f3f4f6;
 --panel:white;
 --accent:#ff5a36;
 --text:#111;
}

.dark{
 --bg:#020617;
 --panel:rgba(255,255,255,0.08);
 --accent:#22c55e;
 --text:white;
}

body{
 margin:0;
 font-family:system-ui;
 background:var(--bg);
 color:var(--text);
 display:flex;
 height:100vh;
 overflow:hidden;
}

/* sidebar */
.side{
 width:35%;
 min-width:180px;
 background:var(--panel);
 padding:20px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 backdrop-filter:blur(10px);
}

.big{
 font-size:80px;
 font-weight:bold;
 color:var(--accent);
}

.month{
 font-size:20px;
 opacity:.8;
 text-align:center;
}

/* main */
.main{
 flex:1;
 padding:16px;
 overflow:auto;
}

.card{
 background:var(--panel);
 padding:14px;
 border-radius:16px;
 margin-bottom:10px;
 backdrop-filter:blur(10px);
 animation:fade .4s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1}
}

.next{
 background:var(--accent);
 color:white;
 font-weight:bold;
}

/* bottom nav */
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 display:flex;
 background:var(--panel);
 backdrop-filter:blur(10px);
}

.bottom button{
 flex:1;
 padding:12px;
 border:none;
 background:none;
 font-size:16px;
}
</style>
</head>

<body>

<div class="side">
 <div class="big" id="bigDate">--</div>
 <div class="month" id="bigMonth"></div>
</div>

<div class="main">

<div class="card" id="hijri">Loading…</div>
<div class="card" id="temp">Loading weather…</div>
<div id="times"></div>

</div>

<div class="bottom">
<button onclick="location.href='index.html'">🏠</button>
<button onclick="history.back()">⬅</button>
<button onclick="toggleTheme()">🌗</button>
</div>

<script>
function toggleTheme(){
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",
 document.body.classList.contains("dark")?"dark":"light");
}
if(localStorage.getItem("theme")==="dark")
 document.body.classList.add("dark");

const q=new URLSearchParams(location.search);
const m=parseInt(q.get("m"));
const d=parseInt(q.get("d"));
const y=new Date().getFullYear();

const dateObj=new Date(y,m,d);

document.getElementById("bigDate").innerText=d;
document.getElementById("bigMonth").innerText=
dateObj.toLocaleDateString("en-US",{month:"long",year:"numeric"});

function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

async function load(){
 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m+1}-${y}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;
 const hijri=j.data.date.hijri;

 document.getElementById("hijri").innerHTML=
 `Hijri: ${hijri.day} ${hijri.month.en} ${hijri.year}`;

 const order=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
 const now=new Date();

 order.forEach(p=>{
  const c=document.createElement("div");
  c.className="card";
  c.innerText=p+" — "+to12(t[p]);

  const pt=new Date();
  const [h,mm]=t[p].split(":");
  pt.setHours(h,mm);

  if(pt>now && !document.querySelector(".next"))
   c.classList.add("next");

  document.getElementById("times").appendChild(c);
 });

 const w=await fetch(
 `https://api.open-meteo.com/v1/forecast?latitude=25.89&longitude=51.19&current_weather=true`
 );
 const weather=await w.json();

 document.getElementById("temp").innerText=
 `🌡 Temperature: ${weather.current_weather.temperature}°C`;
}

load();
</script>

</body>
</html>
