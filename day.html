<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day</title>

<style>
body{
 font-family:system-ui;
 background:linear-gradient(#dbeafe,#f8fafc);
 padding:12px;
 color:#0f172a;
}

.nav{display:flex;gap:8px;margin-bottom:10px}
.nav button{
 flex:1;padding:10px;border:none;border-radius:12px;
 background:#22c55e;color:white;font-weight:bold
}

.glass{
 backdrop-filter:blur(14px);
 background:rgba(255,255,255,0.6);
 border:1px solid rgba(255,255,255,0.8);
 border-radius:16px;
 padding:14px;
 margin-bottom:10px;
}

.next{background:#22c55e;color:white;font-weight:bold}
.off{
 background:#facc15;
 padding:6px 10px;
 border-radius:10px;
 display:inline-block;
 font-weight:bold;
}

.temp{text-align:center;font-size:18px}
</style>
</head>

<body>

<div class="nav">
<button onclick="location.href='index.html'">🏠 Home</button>
<button onclick="history.back()">⬅ Back</button>
</div>

<h2 id="date"></h2>
<div id="off"></div>

<div class="glass temp" id="temp">Loading weather…</div>
<div id="times"></div>

<script>
const q=new URLSearchParams(location.search);
const m=parseInt(q.get("m"));
const d=parseInt(q.get("d"));
const year=new Date().getFullYear();

const dateObj=new Date(year,m,d);
document.getElementById("date").innerText=
dateObj.toDateString();

if(dateObj.getDay()==5 || dateObj.getDay()==6)
 document.getElementById("off").innerHTML=
 '<div class="off">OFF DAY</div>';

function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

async function loadPrayer(){
 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m+1}-${year}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;

 const order=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
 const now=new Date();

 order.forEach(p=>{
  const c=document.createElement("div");
  c.className="glass";
  c.innerText=p+" — "+to12(t[p]);

  const pt=new Date();
  const [h,mm]=t[p].split(":");
  pt.setHours(h,mm);

  if(pt>now && !document.querySelector(".next"))
   c.classList.add("next");

  document.getElementById("times").appendChild(c);
 });
}

async function weather(){
 const r=await fetch(
 `https://api.open-meteo.com/v1/forecast?latitude=25.89&longitude=51.19&current_weather=true`
 );
 const w=await r.json();
 document.getElementById("temp").innerText=
 `🌡 ${w.current_weather.temperature}°C`;
}

loadPrayer();
weather();
</script>

</body>
</html>
