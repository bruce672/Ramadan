<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruwais Ramadan Calendar</title>

<style>
body {
  font-family: system-ui, Arial;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: white;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  color: #facc15;
  font-size: 22px;
}

.today-card {
  background: linear-gradient(135deg, #22c55e, #38bdf8);
  padding: 14px;
  border-radius: 14px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin: 15px 0;
  color: black;
  box-shadow: 0 0 20px rgba(56,189,248,0.6);
}

/* GRID: 2–4 per row */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

.day-box {
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  font-size: 13px;
  transition: 0.25s;
}

.day-box:hover {
  transform: scale(1.04);
  background: rgba(255,255,255,0.15);
}

.today-box {
  background: linear-gradient(135deg, #22c55e, #38bdf8);
  color: black;
  font-weight: bold;
  box-shadow: 0 0 15px rgba(34,197,94,0.7);
}

.date {
  opacity: 0.8;
  font-size: 12px;
}

footer {
  text-align: center;
  margin-top: 15px;
  opacity: 0.7;
  font-size: 12px;
}
</style>
</head>

<body>

<h1>🌙 Ruwais Ramadan</h1>

<div id="todayCard" class="today-card">
Loading today's times...
</div>

<div id="grid" class="grid"></div>

<footer>Ruwais, Qatar • 12-hour format</footer>

<script>
function to12hr(time) {
  let [h, m] = time.split(":");
  h = parseInt(h);
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

async function load() {
  const grid = document.getElementById("grid");
  const todayCard = document.getElementById("todayCard");
  const year = new Date().getFullYear();

  const res = await fetch(
    `https://api.aladhan.com/v1/calendarByCity/${year}/3?city=Ruwais&country=Qatar&method=2`
  );

  const data = await res.json();
  const today = new Date();

  data.data.forEach((day, i) => {
    const d = new Date(day.date.gregorian.date);
    if (d < today.setHours(0,0,0,0)) return;

    const sehri = to12hr(day.timings.Fajr.split(" ")[0]);
    const iftar = to12hr(day.timings.Maghrib.split(" ")[0]);

    const box = document.createElement("div");
    box.className = "day-box";

    if (d.toDateString() === new Date().toDateString()) {
      box.classList.add("today-box");
      todayCard.innerHTML = `
        TODAY — Ruwais
        <div>Sehri: ${sehri}</div>
        <div>Iftar: ${iftar}</div>
      `;
    }

    box.innerHTML = `
      <div><b>Day ${i + 1}</b></div>
      <div class="date">${day.date.gregorian.date}</div>
      <div>Sehri: ${sehri}</div>
      <div>Iftar: ${iftar}</div>
    `;

    grid.appendChild(box);
  });
}

load();
</script>

</body>
</html>
