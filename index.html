<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar</title>
<style>
body{font-family:system-ui;background:#020617;color:white;padding:10px}
h1{text-align:center;color:#facc15}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.month{
 background:rgba(255,255,255,0.08);
 border:1px solid rgba(255,255,255,0.15);
 border-radius:14px;
 padding:14px;
 text-align:center;
 cursor:pointer;
}
.month:hover{background:#22c55e;color:black}
</style>
</head>

<body>

<h1>📅 Calendar</h1>
<div class="grid" id="cal"></div>

<script>
const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

const cal=document.getElementById("cal");

months.forEach((m,i)=>{
 const d=document.createElement("div");
 d.className="month";
 d.innerText=m;
 d.onclick=()=>location.href=`month.html?m=${i}`;
 cal.appendChild(d);
});
</script>

</body>
</html>
