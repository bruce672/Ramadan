<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Dashboard</title>

<style>
body{
 margin:0;
 font-family:system-ui;
 background:linear-gradient(#06351f,#02140b);
 color:white;
 overflow-x:hidden;
}

/* ARCH HEADER */
.header{
 position:relative;
 padding:30px 15px 20px;
 text-align:center;
 background:linear-gradient(#0e7c44,#075c32);
 border-bottom-left-radius:40px;
 border-bottom-right-radius:40px;
 box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.header:before{
 content:"";
 position:absolute;
 inset:0;
 background:
 radial-gradient(circle at 20% 20%,rgba(255,255,255,.08),transparent 40%),
 radial-gradient(circle at 80% 10%,rgba(255,255,255,.05),transparent 40%);
 border-bottom-left-radius:40px;
 border-bottom-right-radius:40px;
}

.prayer{
 font-size:18px;
 opacity:.9;
}

.bigtime{
 font-size:52px;
 font-weight:bold;
 margin:4px 0;
 letter-spacing:1px;
}

/* GOLD STRIP */
.fast{
 margin-top:8px;
 background:linear-gradient(#f8e08a,#d4af37);
 color:#3b2a00;
 padding:8px;
 border-radius:20px;
 font-weight:bold;
}

/* CONTENT */
.container{
 padding:15px;
 margin-bottom:70px;
}

.card{
 background:rgba(255,255,255,.05);
 border-radius:18px;
 padding:14px;
 margin-bottom:12px;
 backdrop-filter:blur(8px);
 box-shadow:0 0 15px rgba(0,0,0,.4);
 animation:fade .5s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1}
}

.row{
 display:flex;
 justify-content:space-between;
 padding:10px 4px;
 border-bottom:1px solid rgba(255,255,255,.08);
 font-size:15px;
}

.row:last-child{border:none}

.next{
 background:#22c55e;
 color:black;
 border-radius:12px;
 padding:6px;
 font-weight:bold;
}

/* BOTTOM NAV */
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:linear-gradient(#0e7c44,#075c32);
 display:flex;
 box-shadow:0 -5px 20px rgba(0,0,0,.5);
}

.bottom button{
 flex:1;
 padding:12px;
 border:none;
 background:none;
 color:white;
 font-size:14px;
}
</style>
</head>

<body>

<div class="header">
 <div class="prayer" id="current">Loading…</div>
 <div class="bigtime" id="big">--:--</div>
 <div class="fast" id="fast">Loading fasting time…</div>
</div>

<div class="container">

<div class="card" id="hijri">Hijri loading…</div>

<div class="card" id="list"></div>

</div>

<div class="bottom">
<button onclick="location.href='index.html'">Home</button>
<button onclick="location.href='month.html?m=2'">Calendar</button>
<button onclick="alert('More features soon')">More</button>
</div>

<script>
function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

async function load(){
 const now=new Date();
 const d=now.getDate();
 const m=now.getMonth()+1;
 const y=now.getFullYear();

 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;
 const hijri=j.data.date.hijri;

 document.getElementById("hijri").innerText=
 `Hijri: ${hijri.day} ${hijri.month.en} ${hijri.year}`;

 document.getElementById("fast").innerText=
 `Sehri ${to12(t.Fajr)} • Iftar ${to12(t.Maghrib)}`;

 const order=["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];
 const nowTime=new Date();

 order.forEach(p=>{
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`<span>${p}</span><span>${to12(t[p])}</span>`;

  const pt=new Date();
  const [h,mm]=t[p].split(":");
  pt.setHours(h,mm);

  if(pt>nowTime && !document.querySelector(".next")){
   row.classList.add("next");
   document.getElementById("current").innerText=p;
   document.getElementById("big").innerText=to12(t[p]);
  }

  document.getElementById("list").appendChild(row);
 });
}

load();
</script>

</body>
</html>
