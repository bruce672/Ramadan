<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Ramadan Dashboard</title>

<style>
body{
 margin:0;
 font-family:system-ui;
 background:linear-gradient(#061d14,#010705);
 color:white;
 overflow-x:hidden;
}

/* CRYSTAL HEADER */
.header{
 margin:15px;
 padding:25px 15px;
 text-align:center;
 border-radius:28px;
 backdrop-filter:blur(14px);
 background:rgba(255,255,255,.08);
 box-shadow:0 0 25px rgba(0,0,0,.6);
 position:relative;
}

/* glow animation */
.header::before{
 content:"";
 position:absolute;
 inset:0;
 border-radius:28px;
 background:
 radial-gradient(circle at 20% 10%,rgba(255,255,255,.15),transparent 40%),
 radial-gradient(circle at 80% 0%,rgba(255,255,255,.08),transparent 40%);
 animation:glow 5s infinite alternate;
}

@keyframes glow{
 from{opacity:.5}
 to{opacity:1}
}

.prayer{font-size:18px;opacity:.9}

.bigtime{
 font-size:56px;
 font-weight:bold;
 letter-spacing:1px;
 margin:6px 0;
}

/* gold fasting strip */
.fast{
 margin-top:8px;
 background:linear-gradient(90deg,#f8e08a,#d4af37,#f8e08a);
 background-size:200% 100%;
 animation:shine 3s linear infinite;
 color:#3b2a00;
 padding:8px;
 border-radius:22px;
 font-weight:bold;
}

@keyframes shine{
 from{background-position:0%}
 to{background-position:200%}
}

.countdown{
 margin-top:6px;
 font-size:14px;
 opacity:.85;
}

/* CONTENT */
.container{
 padding:0 15px 20px;
}

.card{
 backdrop-filter:blur(12px);
 background:rgba(255,255,255,.07);
 border-radius:22px;
 padding:16px;
 margin-bottom:12px;
 box-shadow:0 0 20px rgba(0,0,0,.5);
 animation:fade .5s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1}
}

.row{
 display:flex;
 justify-content:space-between;
 padding:10px 5px;
 border-bottom:1px solid rgba(255,255,255,.08);
 font-size:15px;
}

.row:last-child{border:none}

.next{
 background:#22c55e;
 color:black;
 border-radius:14px;
 padding:6px;
 font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
 <div class="prayer" id="current">Loading…</div>
 <div class="bigtime" id="big">--:--</div>
 <div class="fast" id="fast">Loading fasting time…</div>
 <div class="countdown" id="countdown">Calculating next prayer…</div>
</div>

<div class="container">

<div class="card" id="hijri">Hijri loading…</div>
<div class="card" id="list"></div>

</div>

<script>
let nextPrayerTime;

function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

function startCountdown(){
 setInterval(()=>{
  if(!nextPrayerTime) return;
  const now=new Date();
  const diff=nextPrayerTime-now;
  if(diff<=0) return;

  const h=Math.floor(diff/3600000);
  const m=Math.floor(diff%3600000/60000);
  const s=Math.floor(diff%60000/1000);

  document.getElementById("countdown").innerText=
  `Next prayer in ${h}h ${m}m ${s}s`;
 },1000);
}

async function load(){
 const now=new Date();
 const d=now.getDate();
 const m=now.getMonth()+1;
 const y=now.getFullYear();

 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;
 const hijri=j.data.date.hijri;

 document.getElementById("hijri").innerText=
 `Hijri: ${hijri.day} ${hijri.month.en} ${hijri.year}`;

 document.getElementById("fast").innerText=
 `Sehri ${to12(t.Fajr)} • Iftar ${to12(t.Maghrib)}`;

 const order=["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];

 order.forEach(p=>{
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`<span>${p}</span><span>${to12(t[p])}</span>`;

  const pt=new Date();
  const [h,mm]=t[p].split(":");
  pt.setHours(h,mm);

  if(pt>now && !nextPrayerTime){
   row.classList.add("next");
   nextPrayerTime=pt;
   document.getElementById("current").innerText=p;
   document.getElementById("big").innerText=to12(t[p]);
  }

  document.getElementById("list").appendChild(row);
 });

 startCountdown();
}

load();
</script>

</body>
</html>
