<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Dashboard</title>

<style>
body{
 margin:0;
 font-family:system-ui;
 background:#071c12;
 color:white;
}

/* HEADER */
.header{
 background:linear-gradient(#0b6b3a,#094d2a);
 padding:20px;
 text-align:center;
 border-bottom-left-radius:30px;
 border-bottom-right-radius:30px;
 box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.prayer{
 font-size:18px;
 opacity:.9;
}

.bigtime{
 font-size:48px;
 font-weight:bold;
 margin:5px 0;
}

.fast{
 background:#d4af37;
 color:black;
 padding:8px;
 border-radius:20px;
 font-weight:bold;
}

/* content */
.container{
 padding:15px;
}

.card{
 background:#0e2b1d;
 border-radius:16px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 0 15px rgba(0,0,0,.3);
 animation:fade .4s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1}
}

.row{
 display:flex;
 justify-content:space-between;
 padding:8px 0;
 border-bottom:1px solid rgba(255,255,255,.08);
}

.next{
 background:#22c55e;
 color:black;
 font-weight:bold;
 border-radius:10px;
 padding:6px;
}

/* bottom nav */
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#0b6b3a;
 display:flex;
}

.bottom button{
 flex:1;
 padding:12px;
 border:none;
 background:none;
 color:white;
 font-size:14px;
}
</style>
</head>

<body>

<div class="header">
 <div class="prayer" id="current">Loading…</div>
 <div class="bigtime" id="big">--:--</div>
 <div class="fast" id="fast">Loading fasting time…</div>
</div>

<div class="container">

<div class="card" id="hijri">Hijri loading…</div>

<div class="card" id="list"></div>

</div>

<div class="bottom">
<button onclick="location.href='index.html'">Home</button>
<button onclick="location.href='month.html?m=2'">Calendar</button>
<button onclick="toggleTheme()">Theme</button>
</div>

<script>
function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

async function load(){
 const now=new Date();
 const d=now.getDate();
 const m=now.getMonth()+1;
 const y=now.getFullYear();

 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;
 const hijri=j.data.date.hijri;

 document.getElementById("hijri").innerText=
 `Hijri: ${hijri.day} ${hijri.month.en} ${hijri.year}`;

 document.getElementById("fast").innerText=
 `Sehri ${to12(t.Fajr)} • Iftar ${to12(t.Maghrib)}`;

 const order=["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];
 const nowTime=new Date();

 order.forEach(p=>{
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`<span>${p}</span><span>${to12(t[p])}</span>`;

  const pt=new Date();
  const [h,mm]=t[p].split(":");
  pt.setHours(h,mm);

  if(pt>nowTime && !document.querySelector(".next")){
   row.classList.add("next");
   document.getElementById("current").innerText=p;
   document.getElementById("big").innerText=to12(t[p]);
  }

  document.getElementById("list").appendChild(row);
 });
}

function toggleTheme(){
 document.body.style.background =
 document.body.style.background=="#071c12"?"#000":"#071c12";
}

load();
</script>

</body>
</html>
