<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramadan Calendar</title>

<style>
body {
  font-family: system-ui, Arial;
  background: #020617;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #facc15;
  margin-bottom: 5px;
}

#location {
  text-align: center;
  opacity: 0.8;
  margin-bottom: 20px;
}

.today-card {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
  color: black;
  font-weight: bold;
  font-size: 22px;
}

.today-card span {
  display: block;
  font-size: 28px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2937;
  text-align: center;
}

th {
  background: #0f172a;
  color: #facc15;
}

.future-row {
  background: #020617;
}

.future-row:hover {
  background: #111827;
}

</style>
</head>

<body>

<h1>🌙 Ramadan Calendar</h1>
<p id="location">Loading location...</p>

<div id="todayCard" class="today-card">
Loading today's times...
</div>

<table>
<thead>
<tr>
<th>Day</th>
<th>Date</th>
<th>Sehri</th>
<th>Iftar</th>
</tr>
</thead>
<tbody id="calendar"></tbody>
</table>

<script>
async function getLocation() {
  const res = await fetch("https://ipapi.co/json/");
  const data = await res.json();
  return data.city + "," + data.country_name;
}

async function getRamadanTimes(city) {
  const year = new Date().getFullYear();
  const res = await fetch(
    `https://api.aladhan.com/v1/calendarByCity/${year}/3?city=${city.split(",")[0]}&country=${city.split(",")[1]}&method=2`
  );
  return await res.json();
}

function buildCalendar(data) {
  const today = new Date();
  const tbody = document.getElementById("calendar");
  const todayCard = document.getElementById("todayCard");

  data.data.forEach((day, i) => {
    const d = new Date(day.date.gregorian.date);

    if (d < today.setHours(0,0,0,0)) return; // hide past days

    const sehri = day.timings.Fajr.split(" ")[0];
    const iftar = day.timings.Maghrib.split(" ")[0];

    if (d.toDateString() === new Date().toDateString()) {
      todayCard.innerHTML = `
        TODAY
        <span>Sehri: ${sehri}</span>
        <span>Iftar: ${iftar}</span>
      `;
    }

    const row = document.createElement("tr");
    row.className = "future-row";

    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${day.date.gregorian.date}</td>
      <td>${sehri}</td>
      <td>${iftar}</td>
    `;

    tbody.appendChild(row);
  });
}

(async function init() {
  const city = await getLocation();
  document.getElementById("location").innerText = "Location: " + city;

  const data = await getRamadanTimes(city);
  buildCalendar(data);
})();
</script>

</body>
</html>
