<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramadan Dashboard</title>

<style>
body{
 font-family:system-ui;
 background:linear-gradient(#dbeafe,#f8fafc);
 padding:12px;
 color:#0f172a;
}

h1{text-align:center;margin-bottom:10px}

/* glass card */
.glass{
 backdrop-filter:blur(14px);
 background:rgba(255,255,255,0.6);
 border:1px solid rgba(255,255,255,0.8);
 border-radius:18px;
 box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.dashboard{
 padding:16px;
 text-align:center;
 font-weight:bold;
 margin-bottom:14px;
}

.temp{font-size:14px;margin-top:4px}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.month{
 padding:16px;
 text-align:center;
 cursor:pointer;
}

.month:hover{background:#22c55e;color:white}
</style>
</head>

<body>

<h1>🌙 Ramadan</h1>

<div class="dashboard glass" id="dash">Loading…</div>

<div class="grid" id="cal"></div>

<script>
function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

async function loadDash(){
 const now=new Date();
 const d=now.getDate();
 const m=now.getMonth()+1;
 const y=now.getFullYear();

 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;

 document.getElementById("dash").innerHTML=
 `Today — Ruwais 🇶🇦<br>
 Sehri: ${to12(t.Fajr)}<br>
 Iftar: ${to12(t.Maghrib)}`;
}

async function weather(){
 const r=await fetch(
 `https://api.open-meteo.com/v1/forecast?latitude=25.89&longitude=51.19&current_weather=true`
 );
 const w=await r.json();
 document.getElementById("dash").innerHTML+=
 `<div class="temp">🌡 ${w.current_weather.temperature}°C</div>`;
}

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

months.forEach((m,i)=>{
 const d=document.createElement("div");
 d.className="month glass";
 d.innerText=m;
 d.onclick=()=>location.href=`month.html?m=${i}`;
 document.getElementById("cal").appendChild(d);
});

loadDash();
weather();
</script>

</body>
</html>
