<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruwais Ramadan Calendar</title>

<style>
body {
  font-family: system-ui, Arial;
  background: #0b0f1a;
  color: #f1f5f9;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #facc15;
}

.today-card {
  background: linear-gradient(135deg, #38bdf8, #22c55e);
  padding: 22px;
  border-radius: 14px;
  margin: 20px 0;
  text-align: center;
  font-weight: bold;
  font-size: 22px;
  color: black;
  box-shadow: 0 0 20px rgba(34,197,94,0.4);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2937;
  text-align: center;
}

th {
  background: #020617;
  color: #facc15;
}

tr:hover {
  background: #111827;
}

.today-row {
  background: #22c55e;
  color: black;
  font-weight: bold;
}

footer {
  text-align: center;
  margin-top: 20px;
  opacity: 0.7;
}
</style>
</head>

<body>

<h1>🌙 Ruwais, Qatar Ramadan Calendar</h1>

<div id="todayCard" class="today-card">
Loading today's times...
</div>

<table>
<thead>
<tr>
<th>Day</th>
<th>Date</th>
<th>Sehri</th>
<th>Iftar</th>
</tr>
</thead>
<tbody id="calendar"></tbody>
</table>

<footer>Times powered by Aladhan API</footer>

<script>
function to12hr(time) {
  let [h, m] = time.split(":");
  h = parseInt(h);
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

async function load() {
  const tbody = document.getElementById("calendar");
  const todayCard = document.getElementById("todayCard");
  const year = new Date().getFullYear();

  const res = await fetch(
    `https://api.aladhan.com/v1/calendarByCity/${year}/3?city=Ruwais&country=Qatar&method=2`
  );

  const data = await res.json();
  const today = new Date();

  data.data.forEach((day, i) => {
    const d = new Date(day.date.gregorian.date);
    if (d < today.setHours(0,0,0,0)) return;

    const sehri = to12hr(day.timings.Fajr.split(" ")[0]);
    const iftar = to12hr(day.timings.Maghrib.split(" ")[0]);

    const row = document.createElement("tr");

    if (d.toDateString() === new Date().toDateString()) {
      row.className = "today-row";
      todayCard.innerHTML = `
        TODAY — Ruwais, Qatar
        <div>Sehri: ${sehri}</div>
        <div>Iftar: ${iftar}</div>
      `;
    }

    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${day.date.gregorian.date}</td>
      <td>${sehri}</td>
      <td>${iftar}</td>
    `;

    tbody.appendChild(row);
  });
}

load();
</script>

</body>
</html>
