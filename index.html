<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramadan Calendar</title>

<style>
body {
  font-family: system-ui, Arial;
  background: #020617;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #facc15;
}

.controls {
  text-align: center;
  margin-bottom: 20px;
}

input, button {
  padding: 10px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

button {
  background: #22c55e;
  color: black;
  cursor: pointer;
  margin-left: 5px;
}

.today-card {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
  color: black;
  font-weight: bold;
  font-size: 22px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2937;
  text-align: center;
}

th {
  background: #0f172a;
  color: #facc15;
}

.loading {
  text-align: center;
  opacity: 0.7;
}
</style>
</head>

<body>

<h1>🌙 Ramadan Calendar</h1>

<div class="controls">
  <input id="city" placeholder="Enter city (e.g. Karachi)" />
  <button onclick="load()">Load</button>
</div>

<div id="todayCard" class="today-card">Enter city to load times</div>

<p id="status" class="loading"></p>

<table>
<thead>
<tr>
<th>Day</th>
<th>Date</th>
<th>Sehri</th>
<th>Iftar</th>
</tr>
</thead>
<tbody id="calendar"></tbody>
</table>

<script>
async function load() {
  const city = document.getElementById("city").value || "Karachi";
  const status = document.getElementById("status");
  const tbody = document.getElementById("calendar");
  const todayCard = document.getElementById("todayCard");

  tbody.innerHTML = "";
  status.innerText = "Loading…";

  try {
    const year = new Date().getFullYear();

    const res = await fetch(
      `https://api.aladhan.com/v1/calendarByCity/${year}/3?city=${city}&country=Pakistan&method=2`
    );

    const data = await res.json();
    const today = new Date();

    data.data.forEach((day, i) => {
      const d = new Date(day.date.gregorian.date);
      if (d < today.setHours(0,0,0,0)) return;

      const sehri = day.timings.Fajr.split(" ")[0];
      const iftar = day.timings.Maghrib.split(" ")[0];

      if (d.toDateString() === new Date().toDateString()) {
        todayCard.innerHTML = `
          TODAY — ${city}
          <div>Sehri: ${sehri}</div>
          <div>Iftar: ${iftar}</div>
        `;
      }

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${i + 1}</td>
        <td>${day.date.gregorian.date}</td>
        <td>${sehri}</td>
        <td>${iftar}</td>
      `;
      tbody.appendChild(row);
    });

    status.innerText = "";
  } catch (e) {
    status.innerText = "Error loading data. Try another city.";
  }
}

load(); // auto-load default
</script>

</body>
</html>
