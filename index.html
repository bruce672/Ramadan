<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramadan Dashboard</title>

<style>
:root{
 --bg:linear-gradient(#dbeafe,#f8fafc);
 --text:#0f172a;
 --glass:rgba(255,255,255,0.6);
}

.dark{
 --bg:#020617;
 --text:white;
 --glass:rgba(255,255,255,0.08);
}

body{
 margin:0;
 font-family:system-ui;
 background:var(--bg);
 color:var(--text);
 padding:12px;
 margin-bottom:70px;
 transition:.3s;
}

h1{text-align:center}

/* glass card */
.glass{
 backdrop-filter:blur(14px);
 background:var(--glass);
 border-radius:18px;
 border:1px solid rgba(255,255,255,.4);
 padding:16px;
 margin-bottom:12px;
 animation:fade .6s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1}
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.month{cursor:pointer;text-align:center}

/* bottom nav */
.bottom{
 position:fixed;
 bottom:0;left:0;right:0;
 display:flex;
 background:var(--glass);
 backdrop-filter:blur(14px);
 border-top:1px solid rgba(255,255,255,.3);
}

.bottom button{
 flex:1;
 padding:12px;
 border:none;
 background:none;
 font-size:16px;
}
</style>
</head>

<body>

<h1>🌙 Ramadan</h1>

<div class="glass" id="dash">Loading…</div>

<div class="grid" id="cal"></div>

<div class="bottom">
<button onclick="location.href='index.html'">🏠</button>
<button onclick="toggleTheme()">🌗</button>
</div>

<script>
function toggleTheme(){
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",
 document.body.classList.contains("dark")?"dark":"light");
}
if(localStorage.getItem("theme")==="dark")
 document.body.classList.add("dark");

function to12(t){
 let [h,m]=t.split(":");
 h=parseInt(h);
 const a=h>=12?"PM":"AM";
 h=h%12||12;
 return `${h}:${m} ${a}`;
}

async function loadDash(){
 const now=new Date();
 const d=now.getDate();
 const m=now.getMonth()+1;
 const y=now.getFullYear();

 const r=await fetch(
 `https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=Ruwais&country=Qatar`
 );
 const j=await r.json();
 const t=j.data.timings;
 const hijri=j.data.date.hijri;

 document.getElementById("dash").innerHTML=
 `Hijri: ${hijri.day} ${hijri.month.en} ${hijri.year}<br>
 Sehri: ${to12(t.Fajr)}<br>
 Iftar: ${to12(t.Maghrib)}`;

 const w=await fetch(
 `https://api.open-meteo.com/v1/forecast?latitude=25.89&longitude=51.19&current_weather=true`
 );
 const weather=await w.json();

 document.getElementById("dash").innerHTML+=
 `<br>🌡 ${weather.current_weather.temperature}°C`;
}

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

months.forEach((m,i)=>{
 const d=document.createElement("div");
 d.className="glass month";
 d.innerText=m;
 d.onclick=()=>location.href=`month.html?m=${i}`;
 document.getElementById("cal").appendChild(d);
});

loadDash();
</script>

</body>
</html>
