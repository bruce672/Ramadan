<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Month</title>

<style>
body{
 font-family:system-ui;
 background:linear-gradient(#dbeafe,#f8fafc);
 padding:12px;
 color:#0f172a;
}

.nav{display:flex;gap:8px;margin-bottom:10px}
.nav button{
 flex:1;padding:10px;border:none;border-radius:12px;
 background:#22c55e;color:white;font-weight:bold
}

.glass{
 backdrop-filter:blur(14px);
 background:rgba(255,255,255,0.6);
 border:1px solid rgba(255,255,255,0.8);
 border-radius:14px;
}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.day{
 padding:6px;text-align:center;cursor:pointer;font-size:12px
}

.today{background:#facc15;font-weight:bold}
.off{background:#ef4444;color:white}

.event{font-size:9px;opacity:.7}
</style>
</head>

<body>

<div class="nav">
<button onclick="location.href='index.html'">🏠 Home</button>
<button onclick="history.back()">⬅ Back</button>
</div>

<h2 id="title"></h2>
<div class="grid" id="days"></div>

<script>
const url=new URLSearchParams(location.search);
const m=parseInt(url.get("m"));

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

document.getElementById("title").innerText=months[m];

const year=new Date().getFullYear();
const totalDays=new Date(year,m+1,0).getDate();
const today=new Date();

const events={
 "12-18":"National Day 🇶🇦",
 "2-11":"Sports Day"
};

for(let i=1;i<=totalDays;i++){
 const dateObj=new Date(year,m,i);
 const weekday=dateObj.toLocaleDateString("en-US",{weekday:"short"});
 const key=`${m+1}-${i}`;

 const d=document.createElement("div");
 d.className="day glass";
 d.innerHTML=`${i}<br>${weekday}`;

 if(events[key])
  d.innerHTML+=`<div class="event">${events[key]}</div>`;

 if(today.getMonth()==m && today.getDate()==i)
  d.classList.add("today");

 if(dateObj.getDay()==5 || dateObj.getDay()==6)
  d.classList.add("off");

 d.onclick=()=>location.href=`day.html?m=${m}&d=${i}`;
 document.getElementById("days").appendChild(d);
}
</script>

</body>
</html>
